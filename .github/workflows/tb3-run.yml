# TB3 agent trials (pass@k) — maintainer `/run`, advisory.
#
# PROVIDED workflow: a thin pointer. Maintained centrally in handshake-orchestration-tb3.
#
# Copy to: .github/workflows/tb3-run.yml in each task repo.

name: TB3 Run

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    # Filter here so an ordinary PR comment never starts a runner. The write-access
    # check and the head-SHA pin live in the reusable workflow, where a task repo
    # cannot weaken them.
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/run') }}
    uses: handshake-project-insight/handshake-orchestration-tb3/.github/workflows/tb3-run.yml@main
    secrets: inherit
