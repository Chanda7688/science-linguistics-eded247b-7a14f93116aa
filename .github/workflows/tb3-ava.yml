# TB3 Adversarial Verifier Audit — maintainer `/ava`, advisory.
#
# PROVIDED workflow: a thin pointer. Maintained centrally in handshake-orchestration-tb3.
#
# Copy to: .github/workflows/tb3-ava.yml in each task repo.

name: TB3 AVA

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  ava:
    # Filter here so an ordinary PR comment never starts a runner. The write-access
    # check and the head-SHA pin live in the reusable workflow, where a task repo
    # cannot weaken them.
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/ava') }}
    uses: handshake-project-insight/handshake-orchestration-tb3/.github/workflows/tb3-ava.yml@main
    secrets: inherit
